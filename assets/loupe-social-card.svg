<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Loupe-8 free browser-based image tools</title>
<desc id="desc">Resize images to exact pixels, crop photos, compress JPG and WebP to a maximum KB limit, and convert image formats in your browser.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FF"/><stop offset="1" stop-color="#DDEBFF"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1269FF"/><stop offset="1" stop-color="#0642BB"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10224A" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1100" cy="70" r="190" fill="#BBD8FF" opacity=".34"/>
<circle cx="80" cy="590" r="220" fill="#9FC7FF" opacity=".24"/>
<rect x="42" y="36" width="1116" height="558" rx="34" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="2" filter="url(#shadow)"/>
<rect x="82" y="74" width="66" height="66" rx="19" fill="url(#blue)"/>
<circle cx="110" cy="101" r="15" fill="none" stroke="#FFFFFF" stroke-width="6"/>
<path d="M121 112 L136 127" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
<text x="166" y="119" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="#10224A">Loupe-8</text>
<rect x="850" y="88" width="260" height="42" rx="21" fill="#EAF4FF"/>
<circle cx="878" cy="109" r="7" fill="#16A36A"/>
<text x="897" y="116" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#18416E">FREE · BROWSER-BASED</text>
<text x="84" y="218" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1269FF" letter-spacing="1.5">IMAGE RESIZER · COMPRESSOR · CONVERTER</text>
<text x="84" y="292" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" fill="#10224A">Resize to exact pixels.</text>
<text x="84" y="360" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" fill="#10224A">Compress to KB limits.</text>
<text x="88" y="416" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#53657A">Crop photos and convert JPG, PNG and WebP in your browser.</text>
<g transform="translate(84 468)">
  <rect width="208" height="54" rx="15" fill="#EAF4FF"/><text x="104" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#174A96">Exact pixels</text>
  <rect x="222" width="192" height="54" rx="15" fill="#EAF4FF"/><text x="318" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#174A96">Max KB</text>
  <rect x="428" width="164" height="54" rx="15" fill="#EAF4FF"/><text x="510" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#174A96">Crop</text>
  <rect x="606" width="210" height="54" rx="15" fill="#EAF4FF"/><text x="711" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#174A96">JPG · PNG · WebP</text>
</g>
<g transform="translate(890 178)">
  <rect width="210" height="256" rx="23" fill="#F3F8FF" stroke="#C9D8EA" stroke-width="2"/>
  <rect x="18" y="18" width="174" height="124" rx="16" fill="#D4E7FF"/>
  <circle cx="151" cy="49" r="17" fill="#FFD16A"/>
  <path d="M31 125 L77 78 L106 109 L131 85 L180 132 L180 142 L31 142Z" fill="#61A2E8"/>
  <rect x="18" y="162" width="174" height="34" rx="9" fill="#FFFFFF" stroke="#C9D8EA"/>
  <text x="30" y="184" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#53657A">Width  1200 px</text>
  <rect x="18" y="205" width="174" height="34" rx="9" fill="#FFFFFF" stroke="#C9D8EA"/>
  <text x="30" y="227" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#53657A">Output  50 KB max</text>
</g>
<text x="84" y="563" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#53657A">No signup · Images processed in your browser · Loupe-8</text>
</svg>