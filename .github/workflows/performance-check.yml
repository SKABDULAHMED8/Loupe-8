name: Loupe performance checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ['perf/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static and syntax regression checks
        run: node --test tests/performance-smoke.test.mjs
